<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyDay | TODO App</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><aside><h2>☑ MyDay</h2><p>PERSONAL WORKSPACE</p><button id="home" class="nav active">☀ Hôm nay</button><button id="stats" class="nav">▥ Thống kê</button><footer>Văn Ngọc Hân<br>31241027313</footer></aside><main><header><div><small>KHÔNG GIAN CÁ NHÂN</small><h1 id="heading">Công việc hôm nay</h1><p id="date"></p></div><button id="add" class="primary">＋ Thêm công việc</button></header><section id="summary" class="cards"></section><section id="tasks"><div class="panel"><h2>Danh sách công việc</h2><div class="filters"><input id="search" placeholder="Tìm kiếm công việc…" aria-label="Tìm kiếm"><select id="status" aria-label="Trạng thái"><option value="all">Mọi trạng thái</option><option value="open">Chưa hoàn thành</option><option value="done">Đã hoàn thành</option></select><select id="priority" aria-label="Ưu tiên"><option value="all">Mọi ưu tiên</option><option>Cao</option><option>Trung bình</option><option>Thấp</option></select><select id="period" aria-label="Thời gian"><option value="today">Hôm nay</option><option value="all">Tất cả ngày</option></select></div><div id="list"></div></div></section><section id="statistics" hidden><div class="panel"><h2>Tiến độ 7 ngày gần nhất</h2><p>Dữ liệu từ cơ sở dữ liệu cá nhân (có dữ liệu mẫu khi mở lần đầu).</p><div id="chart"></div><h2>Phân bố mức ưu tiên</h2><div id="distribution"></div></div></section></main><dialog id="modal"><form id="form"><h2 id="formTitle">Thêm công việc</h2><label>Tên công việc *<input id="name" required maxlength="120"></label><label>Mô tả<textarea id="description" rows="3"></textarea></label><label>Ngày thực hiện *<input id="due" type="date" required></label><label>Mức ưu tiên<select id="level"><option>Cao</option><option selected>Trung bình</option><option>Thấp</option></select></label><label>Trạng thái<select id="state"><option value="open">Chưa hoàn thành</option><option value="done">Đã hoàn thành</option></select></label><div class="actions"><button type="button" id="cancel">Hủy</button><button class="primary" type="submit">Lưu công việc</button></div></form></dialog><div id="notice" role="status"></div></body></html>
